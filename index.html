// Bilder im Hintergrund vorladen, damit spätere Fragen schneller erscheinen.
function preloadQuizImages() {
  const imagePaths = new Set([
    "karte/intro.png",
    "sound.png",
    "welt.gif"
  ]);

  function collectImages(item) {
    if (!item || typeof item !== "object") return;

    if (typeof item.image === "string") {
      imagePaths.add(item.image);
    }

    if (Array.isArray(item)) {
      item.forEach(collectImages);
      return;
    }

    Object.values(item).forEach(value => {
      if (value && typeof value === "object") {
        collectImages(value);
      }
    });
  }

  collectImages(questions);

  // Bilder nach dem Start in kleinen Portionen laden,
  // damit die erste Frage nicht unnötig ausgebremst wird.
  const paths = [...imagePaths];
  let index = 0;

  function loadNextBatch() {
    const batchEnd = Math.min(index + 4, paths.length);

    while (index < batchEnd) {
      const img = new Image();
      img.src = paths[index++];
    }

    if (index < paths.length) {
      setTimeout(loadNextBatch, 150);
    }
  }

  loadNextBatch();
}

  "Whisky": 0,
  "Winnetou": 0,
  "Wildwest": 0,
  "Waldmeister": 0,
  "Woodstock": 0,
  "Test": 0
};

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");

const exclusiveNames = [
  "Don Armani Karlheinz",
  "Pepsi Carola",
  "Anakin Skywalker",
  "Cinderella Melodie",
  "Imperial Purity",
  "Leonardo da Vinci Franz",
  "Axel Schweiß"
];

const priorityNames = [
  "Kaiser",
  "König",
  "Prinzessin",
  "Doktor",
  "Großherzog",
  "Seniorina",
  "Judas"
];


function startTest() {

  // Bilder im Hintergrund laden, sobald der Besucher den Test startet
  preloadQuizImages();

    // Browser Audio freischalten
  const unlock = new Audio();
  unlock.play().catch(()=>{});

  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();
}

function showQuestion() {

   isSecretQuestion = !!injectedQuestion;

  const q = injectedQuestion || questions[current];
  injectedQuestion = null;
  answersEl.innerHTML = "";
  questionEl.innerHTML = "";

if (isSecretQuestion) {
  if (q.specialMusic) {
    secretSound.pause();
    secretSound.currentTime = 0;

    specialSecretSound.currentTime = 0;
    specialSecretSound.play().catch(err => console.log(err));
    
  } else {
    specialSecretSound.pause();
    specialSecretSound.currentTime = 0;

    secretSound.currentTime = 0;
    secretSound.play().catch(err => console.log(err));
  }

  document.body.classList.add("secret-mode");
} else {
  secretSound.pause();
  secretSound.currentTime = 0;

  specialSecretSound.pause();
  specialSecretSound.currentTime = 0;

  document.body.classList.remove("secret-mode");
}
  if (q.cursor) {
    document.body.className = q.cursor || "";
  
}

  if (q.image) {
    const img = document.createElement("img");
    img.src = q.image;
    img.className = "question-image";
    questionEl.appendChild(img);
  } else if (q.text) {
    const h1 = document.createElement("h1");
    h1.textContent = q.text;
    questionEl.appendChild(h1);
  }


const hasImages = q.answers.some(a => a.image);

if (hasImages) {
  if (q.layout === "vertical") {
    answersEl.className = "answers-vertical";
  } else {
    answersEl.className = "answers-grid";
  }
} 
else if (q.layout === "two-col") {
  answersEl.className = "answers-two-col";
} 
else {
  answersEl.className = "";
}


 q.answers.forEach(a => {


if (a.image) {
  const tile = document.createElement("div");
  tile.className = "image-answer";

  if (q.layout === "vertical") {
    tile.classList.add("vertical");
  }

  tile.innerHTML = `<img src="${a.image}" alt="">`;

  // Hover-Sound für Bildantworten
  let sound;

  if (a.sound) {
    sound = new Audio(a.sound);
    sound.volume = 0.5;

    tile.addEventListener("mouseenter", () => {
      currentSound = sound;
      sound.currentTime = 0;
      sound.play().catch(() => {});
    });

    tile.addEventListener("mouseleave", () => {
      sound.pause();
      sound.currentTime = 0;
    });
  }

  // Klick
  tile.onclick = () => answer(a.points, a.sequence, a.secret);

  answersEl.appendChild(tile);
}

  else {
    const btn = document.createElement("button");
    btn.textContent = a.text;

    // 👉 Audio vorbereiten (einmal!)
let sound;

    // Hover Sound
if (a.sound) {
  sound = new Audio(a.sound);
  sound.volume = 0.5;

         // 👉 Hover START
  btn.addEventListener("mouseenter", () => {

  currentSound = sound;

  sound.currentTime = 0;
  sound.play().catch(()=>{});
});

  // 👉 Hover ENDE
  btn.addEventListener("mouseleave", () => {
    sound.pause();
    sound.currentTime = 0;
      });
    }

    // Klick
    btn.onclick = () => {
      answer(a.points, a.sequence, a.secret);
    };

    answersEl.appendChild(btn);
  }

});


function answer(points, sequence, secret) {

  if (isSecretQuestion) {
  secretSound.pause();
  secretSound.currentTime = 0;
}
 if (currentSound) {
    currentSound.pause();
    currentSound.currentTime = 0;
  }

  for (const key in points) {
    if (!(key in scores)) scores[key] = 0;
    scores[key] += points[key];
  }

  if (secret) {
    injectedQuestion = secret;

  }


  if (sequence) {
    showSequence(sequence);
    return;
  }


if (!isSecretQuestion) {
  current++;
}
  current < questions.length ? showQuestion() : showResult();
}

function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const resultList = document.getElementById("resultList");
  resultList.innerHTML = "";
  const finalNameEl = document.getElementById("finalName");


const sorted = Object.entries(scores)
  .filter(([key, value]) => value > 0)
  .map(([key, value]) => ({
    key,
    score: value
  }))
  .sort((a, b) => b.score - a.score)
  .slice(0, 10);

const maxScore = sorted[0]?.score || 1;

const top1 = sorted[0]?.key;
const top2 = sorted[1]?.key;

let first = top1;
let second = top2;
let displayName = "";

if (exclusiveNames.includes(top1)) {
  displayName = top1;
}
else if (exclusiveNames.includes(top2)) {
  displayName = top2;
}
else {
  // Priority prüfen
  if (priorityNames.includes(top2) && !priorityNames.includes(top1)) {
    first = top2;
    second = top1;
  }

  displayName = `${first} ${second}`;
}

finalNameEl.innerHTML = `
  <div class="world-card">
    <img src="welt.gif" class="result-image">
    <div class="world-card-text">
      <div class="welcome-text">Welcome to earth:</div>
<div class="name-text">${displayName}</div>
    </div>
  </div>
`;


  // Balkenliste
sorted.forEach(item => {

  const width = (item.score / maxScore) * 100;

  const pointText = item.score === 1
  ? "1 Punkt"
  : `${item.score} Points`;

  const row = document.createElement("div");
  row.className = "result-item";

  row.innerHTML = `
    <div class="result-header">
      <span>${item.key}</span>
<span>${pointText}</span>
    </div>
    <div class="bar-bg">
      <div class="bar-fill"></div>
    </div>
  `;

  resultList.appendChild(row);

  setTimeout(() => {
    row.querySelector(".bar-fill").style.width = width + "%";
  }, 100);
});

}

function showSequence(src) {

  document.getElementById("quiz").classList.add("hidden");

  const seq = document.getElementById("sequence");
  const img = document.getElementById("sequenceImg");

img.src = src + "?t=" + Date.now();
  setTimeout(() => img.src = src, 10); // GIF neu starten

  seq.classList.remove("hidden");

  setTimeout(() => {

    seq.classList.add("hidden");

    current++;

    if (current < questions.length) {
      document.getElementById("quiz").classList.remove("hidden");
      showQuestion();
    } else {
      showResult();
    }

  }, 10000);

}


  }


</script>
